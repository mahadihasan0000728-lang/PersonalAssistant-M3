<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistant M.3</title>
<style>
body{font-family:system-ui;background:#f6f6f6;padding:14px}
.card{background:#fff;border-radius:18px;padding:18px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:10px 0;font-size:16px}
.btn{width:100%;padding:15px;border:0;border-radius:12px;font-weight:700;font-size:17px}
.black{background:#111;color:#fff}
</style></head><body>
<div class="card"><h1>Assistant M.3 ✨</h1><p>আপনার ব্যক্তিগত ভয়েস অ্যাসিস্ট্যান্ট</p>
<input id="text" placeholder="ভয়েসে যা শুনতে চাও লিখো...">
<input id="time" type="time">
<button class="btn black" onclick="addTask()">🔔 ভয়েস অ্যালার্ম সহ যোগ করুন</button>
<p id="status" style="background:#fef9c3;padding:10px;border-radius:10px">✅ অ্যালার্ম ফোনের সিস্টেমে সেভ হবে - অ্যাপ বন্ধ থাকলেও বাজবে</p>
</div><div id="list"></div>
<script>
let tasks=JSON.parse(localStorage.getItem('m3')||'[]');
function save(){localStorage.setItem('m3',JSON.stringify(tasks));render();}
function addTask(){
  let t=document.getElementById('text').value.trim();
  let tm=document.getElementById('time').value;
  if(!t||!tm) return alert('লেখা আর টাইম দাও');
  tasks.push({t,tm}); save();
  // Native Android কে বলবে অ্যালার্ম সেট করতে
  if(window.AndroidBridge) window.AndroidBridge.setAlarm(t, tm);
  else alert('APK তে ইন্সটল করলে অ্যালার্ম সেভ হবে');
  document.getElementById('text').value='';
}
function render(){document.getElementById('list').innerHTML=tasks.map((x,i)=>`<div style="background:#fff;padding:14px;border-radius:14px;margin-top:10px;display:flex;justify-content:space-between"><div><b>${x.t}</b><br>🔔 ${x.tm}</div><button onclick="tasks.splice(${i},1);save()">🗑️</button></div>`).join('');}
render();
</script></body></html>
