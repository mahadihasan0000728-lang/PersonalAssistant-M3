name: Build APK
"on":
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK with Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap init --manifest=https://mahadidev7.github.io/PersonalAssistant-M3/manifest.json --directory=./twa-project || true
          cd twa-project || exit 0
          ./gradlew assembleRelease || ./gradlew assembleDebug || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: "**/*.apk"
