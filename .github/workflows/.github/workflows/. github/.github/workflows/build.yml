name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK with Capacitor
        run: |
          npm install -g @capacitor/cli
          echo "Building M3 APK..."
      - uses: actions/upload-artifact@v4
        with:
          name: M3-APK
          path: "*.apk"
